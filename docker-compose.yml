services:
  evepraisal:
    build: .
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports: ["8080:8080"]
    volumes:
      - ./data:/data
      - ./evepraisal.toml:/etc/evepraisal/evepraisal.toml:ro
    restart: unless-stopped
    # stop_grace_period >= (HTTP + HTTPS + management servers) x 10s shutdown timeout
    stop_grace_period: 30s
